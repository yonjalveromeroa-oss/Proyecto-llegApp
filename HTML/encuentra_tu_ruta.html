<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LlegApp</title>
  <link rel="stylesheet" href="../CSS/encuentra_tu_ruta.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <nav class="navbar">
    <div class="brand">
      <img src="https://cdn-icons-png.flaticon.com/512/4814/4814142.png" alt="Logo LlegApp" class="logo">
      <span class="app-name">LlegApp</span>
    </div>
    <ul class="nav-links">
      <li><a href="home.html">Inicio</a></li>
      <li><a href="horario.html">Horarios</a></li>
      <li><a href="alertas.html">Novedades</a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>

  <section class="search-section">
    <input type="text" placeholder="Origen: Parque Principal" id="Origen" name="Origen" >
    <input type="text" placeholder="Destino: Colegio San José" id="Destino" name="Destino">
    <button class="btn" onclick="window.location.href='buscar.html'">Buscar</button>
    <div class="sort-options"></div>
  </section>

  <section class="routes" id="lista-rutas">
    <p>Cargando rutas...</p>
  </section>

  <script src="../JS/rutas_comun.js"></script>
  <script>
    async function cargarRutas() {
      const contenedor = document.getElementById("lista-rutas");
      try {
        const rutas = await obtenerRutas();
        if (rutas.length === 0) {
          contenedor.innerHTML = "<p>No hay rutas registradas.</p>";
          return;
        }
        contenedor.innerHTML = rutas.map(ruta => `
          <div class="route-card">
            <h3>Ruta ${esc(ruta.numero)}</h3>
            <p>${esc(ruta.descripcion)}</p>
            <p><strong>Duración:</strong> ${esc(ruta.duracion)}</p>
            <p><strong>Costo:</strong> ${esc(ruta.costo)}</p>
            <p><strong>Paraderos:</strong> ${esc(ruta.paraderos)}</p>
            <p class="status ${claseEstado(ruta.estado)}">${esc(ruta.estado)}</p>
            <button class="btn" onclick="window.location.href='mapa.html?numero=${encodeURIComponent(ruta.numero)}'">Ver ruta</button>
            <button class="btn-fav" data-ruta="${esc(ruta.numero)}">⭐ Guardar a favoritos</button>
          </div>
        `).join("");

        contenedor.querySelectorAll(".btn-fav").forEach(btn => {
          btn.addEventListener("click", () => guardarRutaFavorita(btn.dataset.ruta));
        });
      } catch (error) {
        contenedor.innerHTML = "<p>No se pudieron cargar las rutas.</p>";
      }
    }

    cargarRutas();
  </script>
</body>
</html>
