<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LlegApp - Editar perfil</title>
  <link rel="stylesheet" href="/CSS/editar_tu_perfil.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="rutas.html">Rutas</a></li>
      <li><a href="horarios.html">Horarios</a></li>
      <li><a href="alertas.html">Alertas</a></li>
      <li><a href="perfil.html" class="active">Perfil</a></li>
    </ul>
  </nav>


  <main class="container">
    <section class="edit-card">
      <div class="circle">JR</div>
      <h2>Editar perfil</h2>
      <form id="editarPerfilForm">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" value="Juan Romero">
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" value="juan.romero@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="colegio">Colegio</label>
          <input type="text" id="colegio" value="Colegio San José">
        </div>

        <div class="form-group">
          <label for="partida">Punto de partida</label>
          <input type="text" id="partida" value="Parque Principal">
        </div>

        <div class="form-group">
          <label for="notificaciones">Notificaciones</label>
          <select id="notificaciones">
            <option selected>Activadas</option>
            <option>Desactivadas</option>
          </select>
        </div>

        <div class="buttons">
          <a href="perfil.html" class="btn-purple">Cancelar</a>
          <button type="submit" class="btn-blue">Guardar cambios</button>
        </div>
      </form>
    </section>
  </main>


  <footer>
    <p>LlegApp · Transporte público para estudiantes</p>
  </footer>
    <script src="/JS/editar.js"></script>

</body>

</html>
