<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LlegApp - Horarios</title>
  <link rel="stylesheet" href="../CSS/horario.css">
</head>
<body>
 
  <header>
 <div class="logo-superior">
        <img src="https://cdn-icons-png.flaticon.com/512/4814/4814142.png" alt="Logo LlegApp">
        <span class="nombre-app">LlegApp</span>
      </div>
    <nav>
      <a href="home.html">Inicio</a>
      <a href="encuentra_tu_ruta.html">Rutas</a>
      <a href="novedades.html">Novedades</a>
      <a href="perfil.html">Perfil</a>
      <a href="rutas_guardadas.html">Rutas guardadas</a>
      
    </nav>
  </header>

  <main class="container">
    <h2>Horarios de rutas</h2>
    <p>Consulta las próximas salidas y frecuencias.</p>

   
    <div class="tabs">
      <button class="tab active" id="fecha-hoy">Hoy</button>
    </div>

    
    <section class="horarios" id="lista-horarios">
      <p>Cargando horarios...</p>
    </section>

    <p class="nota">Los horarios son aproximados y pueden variar según tráfico.</p>
  </main>

  <script src="../JS/rutas_comun.js"></script>
  <script>

    function cargarHorarios() {
      obtenerRutas().then(rutas => {
        document.getElementById("lista-horarios").innerHTML = rutas.map(ruta => {
          const salidas = (ruta.salidas || "").split(",").map(h => h.trim()).filter(Boolean);
          return `
            <div class="ruta">
              <h3>Ruta ${esc(ruta.numero)}</h3>
              <p><strong>Salidas:</strong> ${salidas.length ? salidas.map(esc).join(" · ") : "Sin horario"}</p>
              <p><strong>Frecuencia:</strong> ${esc(ruta.frecuencia || "Sin definir")}</p>
              <p class="status ${claseEstado(ruta.estado)}">${esc(ruta.estado)}</p>
            </div>
          `;
        }).join("") || "<p>No hay rutas registradas.</p>";
      }).catch(() => {
        document.getElementById("lista-horarios").innerHTML = "<p>No se pudieron cargar los horarios.</p>";
      });
    }

    document.getElementById("fecha-hoy").textContent = "Hoy · " +
      new Date().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });

    cargarHorarios();
    setInterval(cargarHorarios, 60000); 
  </script>
</body>
</html>
