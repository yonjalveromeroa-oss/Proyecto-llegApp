<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LlegApp - Crear cuenta</title>
  <link rel="stylesheet" href="../CSS/crear.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <img src="https://cdn-icons-png.flaticon.com/512/4814/4814142.png" alt="Logo LlegApp" class="logo">
      <h1 class="app-name">LlegApp</h1>
    </div>

    <div class="form-section">
      <h2>Crear tu cuenta</h2>
      <p class="subtitle">Regístrate para guardar rutas y recibir alertas</p>

      <form  action="" method="post" id="registroForm">
        <input type="text" placeholder="Nombre completo" required id="nombre" name="nombre">
        <input type="email" placeholder="Correo electrónico" required id="correo" name="correo">
        <input type="text" placeholder="Colegio" required id="colegio" name="colegio">
        <input type="password" placeholder="Contraseña" required id="Contraseña" name="Contraseña">
        
        <label class="checkbox">
          <input type="checkbox" required id="terminos">
          Acepto términos y condiciones
        </label>
        
        <button type="submit" class="crear-button">
          Crear cuenta
        </button>
      </form>

      <p class="login-link">
        ¿Ya tienes cuenta? <a href="inicio_sesión.html">Iniciar sesión</a>
      </p>
    </div>
  </div>

 
  <script>
    document.getElementById("registroForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const colegio = document.getElementById("colegio").value.trim();
      const password = document.getElementById("password").value.trim();
      const terminos = document.getElementById("terminos").checked;

      if (nombre === "" || correo === "" || colegio === "" || password === "" || !terminos) {
        Swal.fire({
          icon: "error",
          title: "Oops...",
          text: "Debes completar todos los campos y aceptar los términos."
        });
        return;
      }

     
      const nuevoUsuario = {
        nombre,
        correo,
        colegio,
        estado: "Activo"
      };

    
      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
      usuarios.push(nuevoUsuario);
      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      Swal.fire({
        icon: "success",
        title: "Cuenta creada correctamente",
        showConfirmButton: false,
        timer: 1500
      });

      
      setTimeout(() => {
        window.location.href = "administrador.html";
      }, 1500);
    });
  </script>
</body>
</html>
