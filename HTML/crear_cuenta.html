<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LlegApp - Crear cuenta</title>
  <link rel="stylesheet" href="../CSS/crear.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <img src="https://cdn-icons-png.flaticon.com/512/4814/4814142.png" alt="Logo LlegApp" class="logo">
      <h1 class="app-name">LlegApp</h1>
    </div>

    <div class="form-section">
      <h2>Crear tu cuenta</h2>
      <p class="subtitle">Regístrate para guardar rutas y recibir alertas</p>

      <form id="registroForm">
        <input type="text" placeholder="Nombre completo" required id="nombre">
        <input type="email" placeholder="Correo electrónico" required id="correo">
        <input type="text" placeholder="Colegio" required id="colegio">
        <input type="password" placeholder="Contraseña" required id="password">
        
        <label class="checkbox">
          <input type="checkbox" required id="terminos">
          Acepto términos y condiciones
        </label>
        
        <button type="submit" class="crear-button">
          Crear cuenta
        </button>
      </form>

      <p class="login-link">
        ¿Ya tienes cuenta? <a href="inicio_sesión.html">Iniciar sesión</a>
      </p>
    </div>
  </div>

 
  <script src="/JS/crear_cuenta.js"></script>
</body>
</html>
