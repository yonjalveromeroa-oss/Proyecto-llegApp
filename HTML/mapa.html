<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta - LlegApp</title>
  <link rel="stylesheet" href="../CSS/mapa.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>
  <div class="container">
    <div class="map">
      <h2 id="ruta-nombre">Cargando ruta...</h2>
      <p id="ruta-descripcion"></p>
      <div id="mapid"></div>
    </div>

    <div class="card">
      <h3>Detalles de la ruta</h3>
      <ul>
        <li id="ruta-estado"></li>
        <li id="ruta-duracion"></li>
        <li id="ruta-costo"></li>
        <li id="ruta-paraderos"></li>
      </ul>
      <button class="save" id="guardarRuta">Guardar ruta</button>
      <div class="opciones">
        <a href="home.html" class="home-btn">Home</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../JS/rutas_comun.js"></script>
  <script>

    var map = L.map('mapid').setView([5.0703, -75.5138], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function dibujarRuta(puntosRuta) {
      if (puntosRuta.length === 0) return false;

      var ruta = L.polyline(puntosRuta, {color: 'blue'}).addTo(map);
      puntosRuta.forEach((punto, i) => {
        L.circleMarker(punto, {radius: 6, color: 'blue'}).addTo(map)
          .on('click', function() {
            Swal.fire({
              icon: "info",
              title: "Paradero " + (i+1),
              text: "Ubicación: " + punto[0].toFixed(4) + ", " + punto[1].toFixed(4)
            });
          });
      });
      map.fitBounds(ruta.getBounds(), { padding: [20, 20] });
      return true;
    }

    const numero = new URLSearchParams(location.search).get("numero");
    const iconos = { "en-servicio": "🟢", "retraso": "🟡", "fuera-servicio": "🔴" };

    async function cargarRuta() {
      const resp = await fetch("../PHP/rutas.php?accion=catalogo&numero=" + encodeURIComponent(numero || ""));
      const datos = await resp.json();
      if (!datos.ok) {
        document.getElementById("ruta-nombre").textContent = "Ruta no encontrada";
        document.getElementById("guardarRuta").disabled = true;
        return;
      }
      const r = datos.ruta;
      document.title = "Ruta " + r.numero;
      document.getElementById("ruta-nombre").textContent = "Ruta " + r.numero;
      document.getElementById("ruta-descripcion").textContent = r.descripcion;
      document.getElementById("ruta-estado").textContent = iconos[claseEstado(r.estado)] + " " + r.estado;
      document.getElementById("ruta-duracion").textContent = "⏱ Tiempo: " + r.duracion;
      document.getElementById("ruta-costo").textContent = "💰 Costo: " + r.costo;
      document.getElementById("ruta-paraderos").textContent = "🪧 Paraderos: " + r.paraderos;

      if (!dibujarRuta(leerCoordenadas(r.coordenadas))) {
        document.getElementById("ruta-descripcion").textContent = r.descripcion + " (esta ruta aún no tiene paraderos ubicados en el mapa)";
      }

      if (claseEstado(r.estado) === "fuera-servicio") {
        Swal.fire({ icon: "error", title: "Ruta no disponible", text: `La Ruta ${r.numero} está fuera de servicio actualmente` });
      } else if (claseEstado(r.estado) === "retraso") {
        Swal.fire({ icon: "warning", title: "Ruta con retraso", text: `La Ruta ${r.numero} presenta retrasos` });
      }
    }

    document.getElementById("guardarRuta").addEventListener("click", () => guardarRutaFavorita(numero));
    cargarRuta();
  </script>
</body>
</html>
