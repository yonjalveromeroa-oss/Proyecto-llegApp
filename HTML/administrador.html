<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador - LlegApp</title>
  <link rel="stylesheet" href="../CSS/administrador.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="admin-container">
    
    <aside class="sidebar">
      <h2>Administrador</h2>
      <ul>
        <li><a href="home.html">🏠 Inicio</a></li>
        <li><a href="encuentra_tu_ruta.html">🚌 Encuentra tu ruta</a></li>
        <li><a href="horario.html">⏱ Horarios</a></li>
        <li><a href="comentarioU.html">⚠️ Novedades</a></li>
        <li><a href="perfil.html">👤 Perfil</a></li>
        <li><a href="editar_tu_perfil.html">✏️ Editar perfil</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header>
        <h1>Panel de control</h1>
        <p>Bienvenido, Administrador</p>
      </header>

      <section class="stats">
        <div class="card">
          <h3>Usuarios registrados</h3>
          <p id="contador-usuarios">0</p>
        </div>
        <div class="card">
          <h3>Rutas activas</h3>
          <p id="contador-rutas">0</p>
        </div>
        <div class="card">
          <h3>Novedades reportadas</h3>
          <p id="contador-novedades">0</p>
        </div>
      </section>

      <section class="users">
        <h2>Gestión de usuarios</h2>
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Colegio</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
        
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="../JS/rutas_comun.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Usuarios
      let usuarios = await (await fetch("../PHP/usuarios.php?accion=listar")).json();
      document.getElementById("contador-usuarios").textContent = usuarios.length;

      const tbody = document.querySelector("tbody");
      tbody.innerHTML = "";
      usuarios.forEach((usuario, index) => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${usuario.nombre}</td>
          <td>${usuario.correo}</td>
          <td>${usuario.colegio}</td>
          <td>${usuario.estado}</td>
          <td>
            <button onclick="eliminarUsuario(${usuario.id})">❌ Eliminar</button>
          </td>
        `;
        tbody.appendChild(fila);
      });

      let novedades = await (await fetch("../PHP/usuarios.php?accion=novedades")).json();
      document.getElementById("contador-novedades").textContent = novedades.length;

      // Rutas activas = las que no están fuera de servicio
      const rutas = await obtenerRutas();
      document.getElementById("contador-rutas").textContent =
        rutas.filter(r => claseEstado(r.estado) !== "fuera-servicio").length;
    });

    async function eliminarUsuario(id) {
      const datos = new FormData();
      datos.append("accion", "eliminar");
      datos.append("id", id);
      await fetch("../PHP/usuarios.php", { method: "POST", body: datos });

      Swal.fire({
        icon: "success",
        title: "Usuario eliminado",
        showConfirmButton: false,
        timer: 1000
      });

      setTimeout(() => location.reload(), 1000);
    }
  </script>
</body>
</html>
