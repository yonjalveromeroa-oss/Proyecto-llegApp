<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LlegApp - Mi perfil</title>
  <link rel="stylesheet" href="../CSS/perfil.css">
</head>
<body>
 
  <nav class="navbar">
    <ul>
      <li><a href="home.html">Inicio</a></li>
      <li><a href="encuentra_tu_ruta.html">Rutas</a></li>
      <li><a href="horario.html">Horarios</a></li>
      <li><a href="novedades.html">Alertas</a></li>
      <li><a href="rutas_guardadas.html">Rutas guardadas</a></li>
      <li><a href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a></li>
    </ul>
  </nav>

  
  <main class="container">

    <section class="profile-card">
      <div class="circle" id="perfil-iniciales"></div>
      <h2 id="perfil-nombre">Cargando...</h2>
      <p id="perfil-email"></p>
      <p id="perfil-colegio"></p>
      <p id="perfil-partida"></p>
      <p id="perfil-total-rutas"></p>
      <p id="perfil-notificaciones"></p>
      <button class="btn-blue" onclick="window.location.href='editar_tu_perfil.html'">Editar perfil</button>
    </section>


    <section class="routes">
      <h2>Mis rutas guardadas</h2>
      <ul id="perfil-rutas"></ul>
      <button class="btn-purple" onclick="window.location.href='encuentra_tu_ruta.html'">Ver rutas</button>
    </section>
  </main>

  <footer>
    <p>LlegApp · Transporte público para estudiantes</p>
  </footer>

  <script src="../JS/rutas_comun.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const perfil = await (await fetch("../PHP/perfiles.php")).json();

      if (!perfil) {
        window.location.href = "inicio_sesion.html";
        return;
      }

      document.getElementById("perfil-iniciales").textContent = perfil.nombre.split(" ").map(p => p[0]).join("").toUpperCase();
      document.getElementById("perfil-nombre").textContent = perfil.nombre;
      document.getElementById("perfil-email").textContent = "Email: " + perfil.email;
      document.getElementById("perfil-colegio").textContent = "Colegio: " + perfil.colegio;
      document.getElementById("perfil-partida").textContent = "Punto de partida: " + (perfil.partida || "No indicado");
      document.getElementById("perfil-notificaciones").textContent = "Notificaciones: " + perfil.notificaciones;

      const rutas = await obtenerRutasGuardadas() || [];
      document.getElementById("perfil-total-rutas").textContent = "Rutas guardadas: " + rutas.length;
      document.getElementById("perfil-rutas").innerHTML = rutas.length
        ? rutas.map(r => `<li>Ruta ${esc(r.numero)}</li>`).join("")
        : "<li>Aún no tienes rutas guardadas.</li>";
    });
  </script>
</body>
</html>
