<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LlegApp - Iniciar sesión</title>
</head>

<body>

    <div class="contenedor">

        <div class="izquierda">

            <div class="logo">
                 LlegApp
            </div>

            <h1>
                Llega a tu colegio<br>
                a tiempo.
            </h1>

            <p>
                Consulta rutas y horarios de manera sencilla.
            </p>

            
        </div>


        <div class="derecha">

            <div class="login">

                <h2>Iniciar sesión</h2>

                <p>
                    Ingresa a tu cuenta de LlegApp.
                </p>


                <form>

                    <div>

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <br>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>

                    <br>


                    <div>

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <br>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>

                    <br>


                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                    <br><br>


                    <button type="submit">
                        Iniciar sesión
                    </button>

                </form>


                <br>


                <p>
                    ¿No tienes cuenta?

                    <a href="#">
                        Crear cuenta
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
